# Single entry point (http://localhost):
#   /api/*, /sanctum/*, /up  -> Laravel (php-fpm in the "app" container)
#   everything else          -> Next.js (the "node" container)
# Neither Laravel nor Next.js publishes its own port.

# Lets the Next.js dev server's hot-reload WebSocket pass through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Only Laravel's front controller is executed; other .php paths go to Next.js (404).
    location = /index.php {
        fastcgi_pass app:9000;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    location / {
        proxy_pass http://node:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
