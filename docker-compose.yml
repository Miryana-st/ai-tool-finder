
services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ai-tool-finder-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-tool-finder-network

  nginx:
    image: nginx:alpine
    container_name: ai-tool-finder-nginx
    restart: unless-stopped
    ports:
      - "3000:80" # the only public entry point: http://localhost:3000 (see nginx/default.conf)
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - node
    networks:
      - ai-tool-finder-network

  node:
    image: node:22-alpine
    container_name: ai-tool-finder-node
    working_dir: /app
    restart: unless-stopped
    # No published port: reachable only through nginx
    environment:
      # Needed for hot reload through a Windows bind mount
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
    # Waits idle until the Next.js app exists (see issue #5)
    command: >
      sh -c "if [ -f package.json ]; then npm install && npm run dev -- -H 0.0.0.0;
      else echo 'frontend/ is empty - see issue #5'; tail -f /dev/null; fi"
    networks:
      - ai-tool-finder-network

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ai-tool-finder-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-tool-finder-network

  mailpit:
    image: axllent/mailpit
    container_name: ai-tool-finder-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI (this machine only)
      - "127.0.0.1:1025:1025" # SMTP (this machine only)
    networks:
      - ai-tool-finder-network

  db:
    image: mysql:8.4
    container_name: ai-tool-finder-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_finder
      MYSQL_USER: ai_finder_user
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3307:3306" # this machine only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-tool-finder-network

volumes:
  mysql_data:
    name: ai-finder_mysql_data # keeps existing DB data regardless of folder name

networks:
  ai-tool-finder-network:
    driver: bridge
