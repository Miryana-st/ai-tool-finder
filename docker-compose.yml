
services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ai-finder-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-finder-network

  nginx:
    image: nginx:alpine
    container_name: ai-finder-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ai-finder-network

  node:
    image: node:22-alpine
    container_name: ai-finder-node
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: tail -f /dev/null
    networks:
      - ai-finder-network

  db:
    image: mysql:8.4
    container_name: ai-finder-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_finder
      MYSQL_USER: ai_finder_user
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-finder-network

volumes:
  mysql_data:

networks:
  ai-finder-network:
    driver: bridge
