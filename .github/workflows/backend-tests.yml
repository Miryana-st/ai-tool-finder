name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, bcmath, exif, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Fast tests without a database first, so a broken unit fails quickly.
      - name: Unit tests
        run: php artisan test --testsuite=Unit

      # phpunit.xml points the feature tests at in-memory SQLite.
      - name: Feature tests
        run: php artisan test --testsuite=Feature
