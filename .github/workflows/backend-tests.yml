name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, bcmath, exif, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Fast tests without a database first, so a broken unit fails quickly.
      - name: Unit tests
        run: php artisan test --testsuite=Unit

      # phpunit.xml points the feature tests at in-memory SQLite.
      - name: Feature tests
        run: php artisan test --testsuite=Feature

  # The API against real MySQL and Redis (phpunit.integration.xml), once the
  # unit and feature tests pass.
  integration:
    needs: tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ai_finder_testing
          MYSQL_USER: ai_finder_user
          MYSQL_PASSWORD: local_dev_password
          MYSQL_ROOT_PASSWORD: local_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -plocal_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # The services are reached through the published ports on the runner.
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, mbstring, bcmath, exif, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Integration tests
        run: php artisan test -c phpunit.integration.xml
